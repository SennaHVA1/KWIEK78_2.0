# Laat Cloudflare Pages de site met de hand opnieuw bouwen, via het tabblad
# Actions of gh workflow run herbouwen.yml. De build haalt zelf de data op;
# deze workflow geeft alleen het startsein.
#
# De vaste planning zit in de worker in herbouwen-worker/. GitHub voerde
# geplande runs uren te laat of helemaal niet uit.
#
# Nodig: een Deploy Hook in Cloudflare (Pages > project > Settings > Builds >
# Deploy hooks) en die url als repository secret CF_DEPLOY_HOOK.
name: Site herbouwen

on:
  workflow_dispatch:

jobs:
  herbouwen:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Hook aanroepen
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret CF_DEPLOY_HOOK ontbreekt."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
